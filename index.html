<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LOGO='https://static.wixstatic.com/media/9caaf8_29182381d4b9430eb5296c902d0fe0a2~mv2.png/v1/fill/w_354,h_170,al_c,q_85,usm_0.66_1.00_0.01,enc_avif,quality_auto/infinitelogofinal.png';
const logo=()=>`<img src="${LOGO}" alt="Infinite" onerror="this.outerHTML='<b>INFINITE</b>'">`;
const MAX_VIDEO_MB=30; /* placeholder limit, change later */
function art(label,h){const s=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400"><defs><radialGradient id="g"><stop offset="0" stop-color="hsl(${h},70%,96%)"/><stop offset="1" stop-color="hsl(${h},55%,76%)"/></radialGradient></defs><rect width="400" height="400" fill="url(#g)"/><rect x="140" y="110" width="120" height="150" rx="14" fill="#fff" stroke="hsl(${h},30%,60%)" stroke-width="3"/><rect x="156" y="222" width="88" height="18" rx="6" fill="hsl(${h},25%,82%)"/><text x="200" y="320" text-anchor="middle" font-family="sans-serif" font-size="20" fill="hsl(${h},35%,28%)">${label}</text></svg>`;return 'data:image/svg+xml;utf8,'+encodeURIComponent(s)}

const photos=[];let n=0;
/* ---------- STATE ---------- */
const PER=24,pg={gallery:1,review:1,mine:1};
let me=null,view='gallery',q='',cur=null,idx=0,queue=[],crop=null,drag=null;
const RATIOS=[['Free','free'],['1:1',1],['4:3',4/3],['3:4',3/4],['16:9',16/9],['9:16',9/16]];

function pager(k,total){const n=Math.ceil(total/PER);if(n<2)return '';const c=pg[k];

h+=b('&#8250;',c+1,c==n,0,'Next page');

function cropHtml(p){return `<div class="mod" role="dialog" aria-modal="true" aria-label="Crop ${esc(p.code)}"><button class="x" data-act="close" aria-label="Close">&times;</button><div><div class="cs" id="cs"><div class="cw" id="cw"><img id="ci" crossorigin="anonymous" src="${p.src}" alt="" draggable="false"><div class="cb" id="cb"><i class="hd" data-h="nw"></i><i class="hd" data-h="ne"></i><i class="hd" data-h="sw"></i><i class="hd" data-h="se"></i><span class="cl" id="cl"></span></div></div></div></div><div><span class="em">Crop photo</span><h2>${esc(p.code)}</h2><p class="sub">Pick a ratio, then drag the box or its corners.</p><div class="rat">${RATIOS.map(([l,v])=>`<button data-act="ratio" data-r="${v}" class="${v=='free'?'on':''}">${l}</button>`).join('')}</div><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:16px"><button class="btn" data-act="cropsave">Save crop</button><button class="btn ghost" data-act="cropcancel">Cancel</button></div></div></div>`}
function initCrop(){const img=$('#ci');const go=()=>{const nw=img.naturalWidth||400,nh=img.naturalHeight||400,st=$('#cs'),s=Math.min(st.clientWidth/nw,st.clientHeight/nh),W=nw*s,H=nh*s,cw=$('#cw');cw.style.width=W+'px';cw.style.height=H+'px';img.style.width='100%';img.style.height='100%';Object.assign(crop,{W,H,nw,nh,x:W*.05,y:H*.05,w:W*.9,h:H*.9});drawBox()};if(img.complete)go();else img.onload=go}
function setRatio(r){crop.r=r;if(r=='free')return;const W=crop.W,H=crop.H,w=Math.min(W*.9,H*.9*r);crop.w=w;crop.h=w/r;crop.x=(W-w)/2;crop.y=(H-crop.h)/2}
function drawBox(){const cb=$('#cb');if(!cb||crop.W==null)return;cb.style.cssText=`left:${crop.x}px;top:${crop.y}px;width:${crop.w}px;height:${crop.h}px`;$('#cl').textContent=Math.round(crop.w/crop.W*crop.nw)+' × '+Math.round(crop.h/crop.H*crop.nh)}
function saveCrop(){const p=photos.find(x=>x.id==crop.pid),img=$('#ci'),{W,H,nw,nh,x,y,w,h}=crop;
const k=String(p.src).startsWith('data:image/svg')?Math.max(1,1000/Math.max(nw,nh)):1;
let ow=w/W*nw*k,oh=h/H*nh*k;const m=Math.min(1,2400/Math.max(ow,oh));ow=Math.round(ow*m);oh=Math.round(oh*m);
const c=document.createElement('canvas');c.width=ow;c.height=oh;let url;
try{const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,ow,oh);g.drawImage(img,x/W*nw,y/H*nh,w/W*nw,h/H*nh,0,0,ow,oh);url=c.toDataURL('image/jpeg',.92)}catch(err){return toast('Could not crop this file.')}
p.orig=p.orig||p.src;p.src=url;crop=null;modal();render();toast('Crop saved. The new version replaces the file in Google Drive (mock).')}
document.addEventListener('pointerdown',e=>{
if(!crop)return;const cw=$('#cw');if(!cw||!cw.contains(e.target))return;
const h=e.target.closest('.hd'),cb=e.target.closest('.cb');if(!h&&!cb)return;
e.preventDefault();const r=cw.getBoundingClientRect();
drag={mode:h?h.dataset.h:'move',px:e.clientX-r.left,py:e.clientY-r.top,b:{x:crop.x,y:crop.y,w:crop.w,h:crop.h}}});
document.addEventListener('pointermove',e=>{
if(!drag||!crop)return;
const r=$('#cw').getBoundingClientRect(),W=crop.W,H=crop.H,b=drag.b,M=40,rx=e.clientX-r.left,ry=e.clientY-r.top;
if(drag.mode=='move'){crop.x=Math.min(W-b.w,Math.max(0,b.x+rx-drag.px));crop.y=Math.min(H-b.h,Math.max(0,b.y+ry-drag.py));drawBox();return}
const px=Math.min(W,Math.max(0,rx)),py=Math.min(H,Math.max(0,ry)),m=drag.mode,dx=m[1]=='e'?1:-1,dy=m[0]=='s'?1:-1,
ax=dx>0?b.x:b.x+b.w,ay=dy>0?b.y:b.y+b.h,aw=dx>0?W-ax:ax,ah=dy>0?H-ay:ay;
let w=dx>0?px-ax:ax-px,h=dy>0?py-ay:ay-py;
if(crop.r=='free'){w=Math.min(aw,Math.max(M,w));h=Math.min(ah,Math.max(M,h))}
else{const rr=crop.r;w=Math.max(w,h*rr);w=Math.min(w,aw,ah*rr);w=Math.max(w,M,M*rr);h=w/rr}
crop.w=w;crop.h=h;crop.x=dx>0?ax:ax-w;crop.y=dy>0?ay:ay-h;drawBox()});

const merge=rows=>rows.map(r=>{const m=mapRow(r),i=photos.findIndex(x=>x.id==m.id);i<0?photos.push(m):photos[i]=m;return m});
/* only ONE page of data is loaded at a time (works for 10,000+ items) */
const C={key:null,v:0,pc:0,gal:{rows:[],total:null},rev:{rows:[],total:null},mine:{rows:[],total:null}};
const ckey=()=>view+'|'+pg[view]+'|'+q;
const dirty=()=>{C.key=null;C.v++};
async function load(){C.gal.total=C.rev.total=C.mine.total=null;photos.length=0;dirty()}
async function fetchView(){const from=(pg[view]-1)*PER,to=from+PER-1;let r;
if(view=='gallery'){let x=sb.from('gallery_items').select('*',{count:'exact'}).order('code').range(from,to);if(q.trim())x=x.ilike('code','%'+q.trim()+'%');r=await x;if(r.error)throw r.error;C.gal={rows:r.data,total:r.count}}
else if(view=='review'){r=await sb.from('photos').select('*',{count:'exact'}).eq('status','pending').order('created_at').range(from,to);if(r.error)throw r.error;C.rev={rows:merge(r.data),total:r.count};C.pc=r.count}
else{r=await sb.from('photos').select('*',{count:'exact'}).eq('uploaded_by',me.id).order('created_at',{ascending:false}).range(from,to);if(r.error)throw r.error;C.mine={rows:merge(r.data),total:r.count}}
if(isAdmin()&&view!='review'){const p=await sb.from('photos').select('id',{count:'exact',head:true}).eq('status','pending');if(!p.error)C.pc=p.count}}
async function need(){if(!me||!/^(gallery|review|mine)$/.test(view)||C.key==ckey())return;const k=ckey(),v=C.v;
try{await fetchView()}catch(e){return toast('Could not load: '+e.message)}
if(v!=C.v||k!=ckey())return;C.key=k;const g=$('#grid');view=='gallery'&&g?g.innerHTML=gridHtml():_render()}
const _render=render;render=function(){_render();need()};
addEventListener('input',e=>{if(e.target.id!='q')return;e.stopImmediatePropagation();q=e.target.value;pg.gallery=1;clearTimeout(need.t);need.t=setTimeout(need,300)},true);
async function loadCode(c){const r=await sb.from('photos').select('*').eq('code',c).eq('status','approved').order('sort_order');if(r.error)throw r.error;merge(r.data)}

/* ---------- LOGIN (real accounts, role from profiles table) ---------- */
async function enter(session){
if(!session){me=null;photos.length=0;render();return}
const {data:pf}=await sb.from('profiles').select('role').eq('id',session.user.id).single();
me={id:session.user.id,email:session.user.email,role:(pf&&pf.role)||'user'};
await load();view='gallery';render()}
addEventListener('submit',async e=>{if(e.target.id!='lf')return;e.preventDefault();e.stopImmediatePropagation();
const {data,error}=await sb.auth.signInWithPassword({email:$('#em').value.trim(),password:$('#pw').value});
if(error){$('#er').textContent=/invalid/i.test(error.message)?'Wrong email or password. Check them and try again.':error.message;return}
enter(data.session)},true);
sb.auth.getSession().then(({data})=>enter(data.session));

/* ---------- ACTIONS ---------- */
const find=id=>photos.find(x=>x.id==id);
const H={
async open(d){await loadCode(d.c);cur=d.c;idx=0;modal()},
async logout(){await sb.auth.signOut();me=null;view='gallery';cur=null;queue=[];photos.length=0;modal();render()},
async approve(d){const p=find(d.p),o=Date.now();await upd(p.id,{status:'approved',sort_order:o});p.status='approved';p.order=o;render();toast('Approved. It is now in the gallery.')},
async reject(d){const r=prompt('Reason for rejecting (optional)');if(r===null)return;const p=find(d.p);await upd(p.id,{status:'rejected',note:r});p.status='rejected';p.note=r;render();toast('File rejected.')},
async main(d){const p=find(d.p),o=Math.min(...appr(cur).map(x=>x.order))-1;await upd(p.id,{sort_order:o});p.order=o;idx=0;modal();render();toast('Main photo updated.')},
async del(d){if(!confirm('Delete this file?'))return;const p=find(d.p);
await fn({a:'delete',ids:[p.drive,p.origId].filter(Boolean)});
const {error}=await sb.from('photos').delete().eq('id',p.id);if(error)throw error;
photos.splice(photos.indexOf(p),1);idx=Math.max(0,idx-1);modal();render();toast('File deleted.')},
async restore(d){const p=find(d.p),bad=p.drive;await upd(p.id,{drive_id:p.origId,orig_drive_id:null});fn({a:'delete',ids:[bad]}).catch(()=>{});
p.drive=p.origId;p.src=dsrc(p.drive,1600);delete p.origId;delete p.orig;modal();render();toast('Original photo restored.')},
async submit(){const code=$('#uc').value.trim().toUpperCase();
if(!code)return toast('Enter the item code first.');if(!queue.length)return toast('Take or choose at least one file.');
const L=queue.slice(),f=L.map(()=>0),ids=[];let done=0,next=0;
const tick=sub=>upl('Uploading '+Math.min(done+1,L.length)+' of '+L.length,sub||'Please keep this page open',f.reduce((x,y)=>x+y,0)/L.length);
tick();
try{const w=async()=>{while(next<L.length){const k=next++,file=await shrink(L[k].file);
ids[k]=await up(file,r=>{f[k]=r*.9;tick(f.every(v=>v>=.6)?'Saving to Google Drive...':null)});f[k]=1;done++;tick()}};
await Promise.all([w(),w(),w()]);
const {error}=await sb.from('photos').insert(L.map((u,k)=>({code,type:u.type,drive_id:ids[k],uploaded_by:me.id,uploaded_email:me.email,status:isAdmin()?'approved':'pending',sort_order:Date.now()+k})));if(error)throw error;
queue=[];await load();view=isAdmin()?'gallery':'mine';render();
toast('Uploaded '+L.length+' file'+(L.length>1?'s':'')+'. '+(isAdmin()?'Published.':'Waiting for admin review.'))}finally{upl()}}
};
addEventListener('click',async e=>{const b=e.target.closest('[data-act]');if(!b||!H[b.dataset.act])return;
e.stopImmediatePropagation();if(b.dataset.act!='open')dirty();const slow=/^(del|restore)$/.test(b.dataset.act);if(slow)upl('Working...','Updating Google Drive',.6);
try{await H[b.dataset.act](b.dataset)}catch(x){toast(x.message||'Something went wrong.')}finally{if(slow)upl()}},true);

async function saveCrop(){try{const p=find(crop.pid),img=$('#ci'),{W,H:Hh,nw,nh,x,y,w,h}=crop;
let ow=Math.round(w/W*nw),oh=Math.round(h/Hh*nh);const m=Math.min(1,2400/Math.max(ow,oh));ow=Math.round(ow*m);oh=Math.round(oh*m);
const c=document.createElement('canvas');c.width=ow;c.height=oh;const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,ow,oh);
g.drawImage(img,x/W*nw,y/Hh*nh,w/W*nw,h/Hh*nh,0,0,ow,oh);
const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',.92));if(!blob)throw 0;
upl('Saving crop','Please keep this page open',.6);const id=await up(new File([blob],p.code+'-crop.jpg',{type:'image/jpeg'}));
await upd(p.id,{drive_id:id,orig_drive_id:p.origId||p.drive});
if(p.origId)fn({a:'delete',ids:[p.drive]}).catch(()=>{});else p.origId=p.drive;
p.drive=id;p.src=dsrc(id,1600);p.orig=dsrc(p.origId,1600);upl();dirty();crop=null;modal();render();toast('Crop saved. Original kept in Google Drive.')}
catch(err){upl();toast('Could not crop this file.')}}


/* ---------- NICER POPUPS + UPLOAD OVERLAY ---------- */
function toast(m,k){const t=$('#toast');k=k||(/fail|could not|wrong|error|enter the|take or choose|too big|not signed|admins only|network/i.test(m)?'er':/uploaded|approved|saved|deleted|restored|updated|published|rejected/i.test(m)?'ok':'in');
t.className='';t.innerHTML=`<span class="ti">${{ok:'&#10003;',er:'!',in:'i'}[k]}</span><span>${esc(m)}</span>`;void t.offsetWidth;t.classList.add('on',k);
clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),k=='er'?5000:3200)}
function upl(t,s,p){let o=$('#upl');if(!t){if(o)o.remove();return}
if(!o){o=document.createElement('div');o.id='upl';o.setAttribute('role','status');o.innerHTML='<div class="ub"><div class="sp"></div><b></b><span></span><div class="bar"><i></i></div></div>';document.body.appendChild(o)}
o.querySelector('b').textContent=t;o.querySelector('span').textContent=s||'';o.querySelector('i').style.width=Math.max(6,Math.round((p||0)*100))+'%'}

/* ---------- FULLSCREEN VIEWER: double-tap / double-click the photo, then zoom ---------- */
const Z={s:1,x:0,y:0,el:null,ps:new Map(),t:0,tx:0,ty:0,d0:1,s0:1},vt={t:0,x:0,y:0,sx:0,sy:0,on:0};
const zimg=e=>{const i=e.target.closest&&e.target.closest('#lb img');if(i&&i!==Z.el){Z.el=i;Z.s=1;Z.x=0;Z.y=0;Z.ps.clear()}return i};
function lbOpen(src){closeLb();const o=document.createElement('div');o.id='lb';o.setAttribute('role','dialog');o.setAttribute('aria-label','Photo viewer');
o.innerHTML='<button class="lbx" aria-label="Close">&times;</button><img alt="" draggable="false"><div class="lbz"><button data-z="-1" aria-label="Zoom out">&minus;</button><button data-z="1" aria-label="Zoom in">+</button></div>';
const im=o.querySelector('img');im.src=src;document.body.appendChild(o);
const hi=new Image();hi.onload=()=>{im.src=hi.src};hi.src=src.replace(/sz=w\d+/,'sz=w2400')}
function closeLb(){const o=$('#lb');if(o)o.remove();Z.el=null;Z.s=1;Z.x=0;Z.y=0;Z.ps.clear()}
function zapply(){const i=Z.el,v=i.closest('#lb'),mx=v.clientWidth*(Z.s-1)/2,my=v.clientHeight*(Z.s-1)/2;
Z.x=Math.max(-mx,Math.min(mx,Z.x));Z.y=Math.max(-my,Math.min(my,Z.y));
i.style.transform=Z.s>1?`translate(${Z.x}px,${Z.y}px) scale(${Z.s})`:'';i.style.cursor=Z.s>1?'grab':'zoom-in'}
function zoomAt(cx,cy,ns){if(!Z.el)return;const r=Z.el.closest('#lb').getBoundingClientRect(),px=cx-(r.left+r.width/2),py=cy-(r.top+r.height/2),k=ns/Z.s;
Z.x=px-(px-Z.x)*k;Z.y=py-(py-Z.y)*k;Z.s=ns;if(ns<=1){Z.x=0;Z.y=0}zapply()}
document.addEventListener('pointerdown',e=>{
const vi=e.target.closest&&e.target.closest('.view img');vt.on=vi?1:0;if(vi){vt.sx=e.clientX;vt.sy=e.clientY}
const i=zimg(e);if(!i)return;Z.ps.set(e.pointerId,{x:e.clientX,y:e.clientY,sx:e.clientX,sy:e.clientY});
if(i.setPointerCapture)try{i.setPointerCapture(e.pointerId)}catch(x){}
if(Z.ps.size==2){const [a,b]=[...Z.ps.values()];Z.d0=Math.hypot(a.x-b.x,a.y-b.y)||1;Z.s0=Z.s}});
document.addEventListener('pointermove',e=>{const st=Z.ps.get(e.pointerId);if(!st||!Z.el)return;
const dx=e.clientX-st.x,dy=e.clientY-st.y;st.x=e.clientX;st.y=e.clientY;
if(Z.ps.size==2){const [a,b]=[...Z.ps.values()];zoomAt((a.x+b.x)/2,(a.y+b.y)/2,Math.max(1,Math.min(5,Z.s0*Math.hypot(a.x-b.x,a.y-b.y)/Z.d0)))}
else if(Z.s>1){Z.x+=dx;Z.y+=dy;zapply()}});
['pointerup','pointercancel'].forEach(t=>document.addEventListener(t,e=>{
if(t=='pointerup'&&vt.on){vt.on=0;const vi=e.target.closest&&e.target.closest('.view img');
if(vi&&Math.hypot(e.clientX-vt.sx,e.clientY-vt.sy)<10){const n=Date.now();if(n-vt.t<320&&Math.hypot(e.clientX-vt.x,e.clientY-vt.y)<40){vt.t=0;lbOpen(vi.src)}else{vt.t=n;vt.x=e.clientX;vt.y=e.clientY}}return}
const st=Z.ps.get(e.pointerId);if(!st)return;
const tap=t=='pointerup'&&Z.ps.size==1&&Math.hypot(e.clientX-st.sx,e.clientY-st.sy)<10;Z.ps.delete(e.pointerId);if(!tap)return;
const now=Date.now();if(now-Z.t<320&&Math.hypot(e.clientX-Z.tx,e.clientY-Z.ty)<40){Z.t=0;zoomAt(e.clientX,e.clientY,Z.s>1?1:2.5)}else{Z.t=now;Z.tx=e.clientX;Z.ty=e.clientY}}));
document.addEventListener('click',e=>{const t=e.target.closest&&e.target.closest('#lb button');if(!t)return;
if(t.classList.contains('lbx'))return closeLb();
const im=$('#lb img');if(!Z.el||Z.el!==im){Z.el=im;Z.s=1;Z.x=0;Z.y=0}
zoomAt(innerWidth/2,innerHeight/2,Math.max(1,Math.min(5,Z.s*(t.dataset.z=='1'?1.6:1/1.6))))});
addEventListener('wheel',e=>{if(!zimg(e))return;e.preventDefault();zoomAt(e.clientX,e.clientY,Math.max(1,Math.min(5,Z.s*(e.deltaY<0?1.2:1/1.2))))},{passive:false});
addEventListener('keydown',e=>{if(e.key=='Escape'&&$('#lb')){e.stopImmediatePropagation();closeLb()}},true);

/* ---------- THUMBNAIL STRIP: fade edges when more files are hidden, keep selected one in view ---------- */
const thFade=t=>{t.classList.toggle('fl',t.scrollLeft>4);t.classList.toggle('fr',t.scrollLeft+t.clientWidth<t.scrollWidth-4)};
{const _modal=modal;modal=function(){const o=$('.th'),sl=o?o.scrollLeft:0;_modal();if(cur!=null){const a=appr(cur);if(a.length>1)[1,2,-1].forEach(d=>{const q=a[(idx+d+a.length*3)%a.length];if(q&&q.type!='video')new Image().src=dsrc(q.drive,1200)})}const t=$('.th');if(!t)return;
t.scrollLeft=sl;thFade(t);t.addEventListener('scroll',()=>thFade(t),{passive:true});
const a=t.querySelector('.on');if(a){const r=a.getBoundingClientRect(),tr=t.getBoundingClientRect();
t.scrollTo({left:t.scrollLeft+(r.left-tr.left)-(t.clientWidth-r.width)/2,behavior:'smooth'})}}}
render();
</script>
</body>
</html>
